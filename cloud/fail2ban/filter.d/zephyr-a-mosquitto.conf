# Zephyr_A - fail2ban filter for Mosquitto 2.0 (part 10, docs/10-nice-to-have.md)
# Installed to /etc/fail2ban/filter.d/ by cloud/scripts/70-fail2ban.sh.
#
# Mosquitto writes the client address only on the "New connection" line; the
# reason a connection fails follows on the next line:
#   2026-11-12T10:00:01: New connection from 203.0.113.7:51234 on port 8883.
#   2026-11-12T10:00:01: Client esp32c6-x disconnected, not authorised.
# so the filter matches two lines (maxlines = 2). Counted as a failure:
#   - wrong user name / password            ("not authorised")
#   - TLS handshake refused for certificate reasons (mTLS listener: no or
#     untrusted client certificate) or a non-TLS / garbage client
#   - MQTT protocol errors before CONNECT (scanners)
# NOT counted: "unexpected eof" (a device losing its cellular link), so a
# device in a coverage hole is never banned.
#
# Test: fail2ban-regex /var/log/mosquitto/mosquitto.log /etc/fail2ban/filter.d/zephyr-a-mosquitto.conf

[Definition]

_conn = New connection from <HOST>:\d+ on port \d+\.

failregex = ^\s*%(_conn)s\n\s*(?:Client \S+ disconnected, not authorised\.|OpenSSL Error\[\d+\]: error:[0-9A-F]+:SSL routines::(?:\S+ alert )?(?:bad certificate|unknown ca|certificate required|certificate unknown|peer did not return a certificate|certificate verify failed|wrong version number|http request|packet length too long|unsupported protocol|no shared cipher)|Client <unknown> disconnected(?:: Protocol error| due to protocol error)\.)$

ignoreregex =

[Init]

maxlines = 2
# log_timestamp_format %Y-%m-%dT%H:%M:%S (cloud/mosquitto/zephyr_a.conf)
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S:
