# Zephyr_A - Mosquitto broker configuration
# Installed to /etc/mosquitto/conf.d/zephyr_a.conf by cloud/scripts/30-mosquitto.sh
# (Ubuntu's /etc/mosquitto/mosquitto.conf already sets persistence, log_dest
#  and "include_dir /etc/mosquitto/conf.d" - those are not repeated here.)
#
# Design (docs/05-cloud.md):
#   - 8883: MQTT over TLS for the devices (Let's Encrypt certificate)
#   - 1883: plain MQTT bound to 127.0.0.1 ONLY, for Node-RED on the same server
#   - no anonymous access; every client needs a user name + password
#   - ACL: least privilege, each edge node may only use its own topics

# Settings below apply to all listeners (authentication, ACL)
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Log every connect/disconnect (who, from where, keep-alive) for diagnostics
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Local listener for Node-RED (not reachable from outside) --------------
listener 1883 127.0.0.1

# --- TLS listener for devices ----------------------------------------------
listener 8883
# Copied from /etc/letsencrypt/live/<domain>/ by the certbot deploy hook,
# so the mosquitto user can read them (letsencrypt/live is root-only).
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
# Minimum TLS version (1.2 and 1.3 allowed); older versions are refused.
tls_version tlsv1.2
