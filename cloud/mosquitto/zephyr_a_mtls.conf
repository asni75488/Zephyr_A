# Zephyr_A - Mosquitto listener with client certificates (mTLS, part 10)
# Installed to /etc/mosquitto/conf.d/zephyr_a_mtls.conf by
# cloud/scripts/65-mtls.sh. Loaded after zephyr_a.conf (alphabetical order),
# so the global settings (ACL, password file for 1883/8883) still apply.
#
#   - 8884: MQTT over TLS, the device MUST present a certificate issued by
#     the own device CA (scripts/device_pki.py, kept on the operator PC)
#   - the certificate CN becomes the MQTT user name, so the ACL patterns
#     (%u = edge node id) work unchanged and no password is needed or read
#   - revoked certificates are refused (crlfile, updated by 65-mtls.sh)
#
# 8883 (password) stays open while devices are migrated; close it with
#   sudo ./65-mtls.sh --close-8883

listener 8884
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
cafile /etc/mosquitto/ca_certificates/zephyr-a-device-ca.crt
crlfile /etc/mosquitto/ca_certificates/zephyr-a-device-crl.pem
require_certificate true
use_identity_as_username true
