# Zephyr_A - release variant (part 8): smallest attack surface
# Used by: .\scripts\build.ps1 -Release   (cannot be combined with the debug variants)
#
# The standard build already has no shell and no TLS debug. The release
# build additionally removes debug aids an attacker with physical access to
# the USB port could use, and keeps the log at warnings for system modules.

# No interactive console commands of any kind
CONFIG_SHELL=n
CONFIG_MBEDTLS_DEBUG=n
CONFIG_MBEDTLS_SHELL=n
# System modules (net, modem, mqtt library ...): warnings and errors only.
# The app modules keep INF (measurements, state changes, security events).
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_APP_LOG_LEVEL_INF=y
# Stack painting is only needed for the stack measurements (part 6/9)
CONFIG_INIT_STACKS=n
# Thread names are useful for an attacker reading memory, not needed in the field
CONFIG_THREAD_NAME=n
