# Zephyr_A - modem debug variant (troubleshooting registration/PPP)
# Used by: .\scripts\build.ps1 -ModemDebug
#
# Adds a shell on the console with Zephyr's modem AT shell (it sends the
# command on a separate CMUX channel, so it works while PPP is up):
#   uart:~$ modem at AT+CSQ           signal quality (rssi,ber)
#   uart:~$ modem at AT+CPSI?         serving cell: LTE CAT-M1 / NB-IOT, band, operator
#   uart:~$ modem at AT+COPS?         operator
#   uart:~$ modem at AT+CEREG?        LTE registration (1 = home, 5 = roaming)
#   uart:~$ modem at AT+CGDCONT?      PDP context / APN
#   uart:~$ net iface                 PPP interface and IP address
#   uart:~$ net dns query zephyra.vps.webdock.cloud A
# plus DEBUG logs from the modem modules (chat, CMUX, PPP) - very verbose.

CONFIG_SHELL=y
CONFIG_SHELL_WILDCARD=n
CONFIG_MODEM_AT_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_MODEM_STATS=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=8192
