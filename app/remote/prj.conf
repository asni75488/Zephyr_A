# Zephyr_A - LP-core image (part 9).
#
# The LP core only reads/writes the shared memory and two registers. It
# needs no drivers, no console and no logging: every byte here runs on each
# LP timer wake-up (the LP image restarts from its reset vector each time).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=n
