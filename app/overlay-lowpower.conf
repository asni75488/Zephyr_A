# Zephyr_A - low-power variant (part 9, scripts\build.ps1 -LowPower).
#
# Interval uplink: the modem is on only for an uplink every 30 minutes, light
# sleep between the measurements (still every 10 s). Values measured and
# reasoned in docs/09-strom-data.md, section 5.
CONFIG_APP_UPLINK_INTERVAL=y
CONFIG_APP_UPLINK_INTERVAL_S=1800
# 12 measurements (2 minutes) per DDATA: half the per-message overhead
# (topic, MQTT, TLS record, TCP/IP) compared with 6
CONFIG_APP_BATCH_SIZE=12
# DNS check only: the TCP connect to port 80 costs ~250 B and radio time on
# every uplink, and the MQTT/TLS connect right after it proves the same
CONFIG_APP_NET_CHECK_PORT=0
