# Zephyr_A - Modbus RTU variant (RS485 on UART0, console on USB Serial/JTAG)
# Used by: .\scripts\build.ps1 -ModbusRtu   (adds app/modbus-rtu.overlay)
# Design: docs/02-arkitektur.md section 6.3, test: docs/03-dataopsamling.md

# Zephyr Modbus subsystem, client (master) role, serial line
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_LOG_LEVEL_WRN=y

# Application settings (app/Kconfig) - must match the slave / simulator
CONFIG_APP_MODBUS_RTU=y
CONFIG_APP_MODBUS_SLAVE_ADDR=1
CONFIG_APP_MODBUS_BAUDRATE=9600
CONFIG_APP_MODBUS_PARITY_EVEN=y
CONFIG_APP_MODBUS_RESP_TIMEOUT_MS=300
CONFIG_APP_MODBUS_RETRIES=2
CONFIG_APP_MODBUS_RETRY_BACKOFF_MS=100
CONFIG_APP_MODBUS_MAX_SKIP_CYCLES=8
