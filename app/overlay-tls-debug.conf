# Zephyr_A - TLS/MQTT debug variant (troubleshooting the broker connection)
# Used by: .\scripts\build.ps1 -TlsDebug   (can be combined with -ModemDebug)
#
# - Mbed TLS handshake state log (level 2) + verification flags on failure
# - Mbed TLS heap statistics: the mqtt thread logs "Mbed TLS heap peak" after
#   each connect, and the shell command "mbedtls heap" shows current/peak use
# - DEBUG log of the app modules (every PUBLISH, PUBACK, PINGREQ/PINGRESP)

CONFIG_MBEDTLS_DEBUG=y
CONFIG_MBEDTLS_LOG_LEVEL_WRN=y
CONFIG_MBEDTLS_MEMORY_DEBUG=y
CONFIG_SHELL=y
CONFIG_SHELL_WILDCARD=n
CONFIG_MBEDTLS_SHELL=y
CONFIG_APP_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=8192
