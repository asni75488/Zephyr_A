# Zephyr_A - extra Kconfig for the MCUboot image (part 8)
#
# Espressif's MCUboot defaults (bootloader/mcuboot/boot/zephyr/socs/
# esp32c6_hpcore.conf) do NOT verify the image in the primary slot at boot
# (CONFIG_BOOT_VALIDATE_SLOT0=n). Then an image written directly with
# "west flash" or esptool would run even with a wrong or missing signature.
# Verify it on every boot (costs ~0.1-0.3 s boot time, measured in part 9).
CONFIG_BOOT_VALIDATE_SLOT0=y

# Updates through the secondary slot (OTA, part 10) must have a higher
# version than the running image (app/VERSION), so an attacker cannot
# install an older, vulnerable version.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
