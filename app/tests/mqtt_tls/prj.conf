# Zephyr_A - native_sim MQTT/TLS test (TLS block appended from app/prj.conf)
CONFIG_STD_C17=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_NET_LOG=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_POLL=y
CONFIG_EVENTS=y

# Host sockets instead of PPP (Native Simulator offloaded sockets)
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_DNS_RESOLVER=n

# Mbed TLS heap peak measurement (mbedtls_memory_buffer_alloc_max_get)
CONFIG_MBEDTLS_MEMORY_DEBUG=y

# Same as app/prj.conf (time sync, Sparkplug B, reboot command)
CONFIG_SNTP=y
CONFIG_NANOPB=y
CONFIG_REBOOT=y
# Local SNTP test server started by run.sh
CONFIG_APP_TIMESYNC_SERVER1="127.0.0.1:1123"
CONFIG_APP_TIMESYNC_SERVER2=""
CONFIG_APP_TIMESYNC_TIMEOUT_MS=2000

# Faster test cycle
CONFIG_APP_MQTT_BACKOFF_MIN_S=2
CONFIG_APP_MQTT_BACKOFF_MAX_S=8
CONFIG_APP_MQTT_KEEPALIVE_S=60
CONFIG_APP_SPARKPLUG_STATUS_INTERVAL_S=6
CONFIG_APP_BATCH_SIZE=3
# Test-only credential for the local test broker started by run.sh
CONFIG_APP_MQTT_PASSWORD="test-password-123"
CONFIG_LOG_BACKEND_SHOW_COLOR=n
