# Zephyr_A - sysbuild configuration (part 8: signed firmware)
#
# MCUboot verifies an ECDSA P-256 signature over the application image.
# The private key is NOT in git: scripts\build.ps1 passes
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=<repo>\certs\mcuboot-signing-key.pem
# when that file exists (create it once with scripts\new-signing-key.ps1).
# Without it, MCUboot's public development key is used and build.ps1 warns:
# such an image is signed, but by a key everybody has.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
