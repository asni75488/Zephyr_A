# Zephyr_A - simulation variant (test without sensor/Modbus hardware)
# Used by: .\scripts\build.ps1 -Simulation
#
# All channels are generated in software: internal temperature (triangle
# 22-25 °C) and - together with -ModbusRtu - two simulated Modbus registers.
# The timer, the message queue, batching, quality flags and the Modbus
# retry/backoff logic run exactly as with real hardware.

CONFIG_APP_SENSOR_SIMULATION=y

# Inject a read error every 5th cycle to exercise LOG_ERR, retry, backoff
# and QUALITY_BAD/STALE. Set to 0 for clean simulated data.
CONFIG_APP_SENSOR_SIM_FAULT_EVERY=5
