# Zephyr_A - measure stack usage on the hardware (part 11).
#   .\scripts\build.ps1 -ExtraConf app\overlay-stack-usage.conf
#
# Every 5 minutes the thread analyzer logs, per thread, how much of its stack
# has ever been used (stacks are filled with a pattern at creation), plus
# the interrupt stack. Run through the worst cases (boot, modem start, TLS
# handshake, NBIRTH, NCMD, link loss) and copy the numbers into
# docs/11-afslutning.md section 2.4. Not for normal builds: filling and
# scanning the stacks costs time and RAM for the analyzer.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=300
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
