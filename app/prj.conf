# Zephyr_A - Kconfig for the HP-core application
# Part 6: data acquisition + cellular network (SIM7080G, CMUX, PPP) + MQTT over TLS.

# --- C standard -----------------------------------------------------------
# Project requirement: compatible with at least C17 (also the 4.4.0 default,
# set explicitly so the requirement is visible in the configuration).
CONFIG_STD_C17=y

# --- Logging --------------------------------------------------------------
CONFIG_LOG=y
# Deferred mode: log calls only queue the message, a low-priority thread
# prints it. Keeps timing-critical threads (modem, MQTT) fast.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Log level of all Zephyr_A modules (app/Kconfig, LOG_MODULE_REGISTER(..., CONFIG_APP_LOG_LEVEL))
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_LOG_BACKEND_UART=y
# Prefix log lines with a timestamp formatted as hh:mm:ss.ms
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
# Colour codes look bad in some Windows terminals; keep the output plain.
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# Print "*** Booting Zephyr OS build ... ***" banner at startup
CONFIG_BOOT_BANNER=y

# --- Hardware info (device id derived from the factory MAC in eFuse) -------
CONFIG_HWINFO=y

# --- Robustness -----------------------------------------------------------
CONFIG_ASSERT=n
CONFIG_STACK_SENTINEL=y
# Compiler stack protector (-fstack-protector): a random canary detects stack
# buffer overflows before a function returns (part 8, IEC 62443-4-2 CR 3.x)
CONFIG_STACK_CANARIES=y
# Stack use measurement (mqtt thread logs its peak use after the TLS handshake)
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# --- Kernel ----------------------------------------------------------------
# k_poll(): app_logic waits on the measurement queue and the command queue
CONFIG_POLL=y

# --- Data acquisition ------------------------------------------------------
# Sensor API for the internal temperature sensor (devicetree: &coretemp)
CONFIG_SENSOR=y

# --- Cellular modem (Zephyr modem_cellular, compatible simcom,sim7080) -------
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
# Onomondo SIM: the APN is always "onomondo", no user/password, no PIN
CONFIG_MODEM_CELLULAR_APN="onomondo"
# Modem UART (uart1) is interrupt-driven (modem backend uart_isr)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Resume/suspend of the modem through the PM device API
CONFIG_PM_DEVICE=y
# Own workqueue for CMUX/PPP/chat so other system work cannot delay it
CONFIG_MODEM_DEDICATED_WORKQUEUE=y
CONFIG_MODEM_MODULES_LOG_LEVEL_WRN=y

# --- Networking: IPv4 over PPP ---------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# DNS servers are learned from the operator via PPP (IPCP)
CONFIG_DNS_RESOLVER=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
# PPP announces a primary and a secondary DNS server
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
# Cellular round-trip times are long (and the first query wakes the radio)
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000
# zsock_getaddrinfo() allocates its result with k_calloc() -> kernel heap
# (default 0 in this configuration, which would make every lookup fail)
CONFIG_HEAP_MEM_POOL_SIZE=4096
# L4 connected/disconnected events from the connection manager
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
# TCP connect timeout for the connectivity check [ms] (cellular RTT is high)
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=10000
CONFIG_NET_LOG=y
CONFIG_NET_IF_LOG_LEVEL_WRN=y

# >>> mqtt-tls  (this block is also used by app/tests/mqtt_tls - keep markers)
# --- MQTT 3.1.1 over TLS (docs/06-mqtt-tls.md) -------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
# One security tag per trusted root CA (4 files in app/ca) plus, with mTLS
# (part 10), one tag holding the client certificate and its private key:
# 4 + 2 = 6 credentials, 5 tags per socket.
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=6
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=5
# Handshake over LTE-M: several round trips of 100-500 ms + chain verification
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=30000
# eventfd: wakes the mqtt thread from zsock_poll() when a message is queued
CONFIG_ZVFS_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=2

# --- Mbed TLS 4.1 + TF-PSA-Crypto --------------------------------------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
# Random numbers for TLS from the ESP32-C6 hardware RNG (zephyr,entropy)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Peak measured in part 6: 32-37 kB (native_sim, 64-bit pointers; 4 trusted
# roots + RSA-4096 chain). The allocator fragments, and 40 kB was NOT enough:
# an allocation failure during chain verification shows up as -0x2700
# "not trusted". 56 kB gives ~50 % margin (docs/06-mqtt-tls.md, section 6).
CONFIG_MBEDTLS_HEAP_SIZE=57344
# Input record buffer: must hold the whole server certificate chain
# (Let's Encrypt Generation Y: 4 certificates, 3-4.5 kB). The output buffer
# is reduced to 2 kB in config/zephyr_a_mbedtls_user.h.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192
CONFIG_MBEDTLS_USER_CONFIG_FILE="zephyr_a_mbedtls_user.h"
# TLS 1.3 (preferred: 1 round trip handshake) and TLS 1.2 as fallback.
# Mosquitto is configured with tls_version tlsv1.2 = minimum 1.2.
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_SSL_EXTENDED_MASTER_SECRET=y
# Certificate chain verification: ECDSA chains (leaf P-256, YE/X2 P-384,
# SHA-384 signatures) and RSA chains (YR/X1 RSA-4096). Which one the server
# uses depends on the key type certbot chose on the VPS (30-certs.sh shows it).
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PSS=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
# TLS 1.3 with an RSA server certificate needs RSA-PSS signatures
# (rsa_pss_rsae_sha256). Without this symbol Mbed TLS does not offer them
# and OpenSSL aborts: "no suitable signature algorithm" (found in part 6).
# Mbed TLS 4.1 also requires RSA-OAEP for this symbol (mbedtls_check_config.h);
# Zephyr's Kconfig does not express that dependency.
CONFIG_MBEDTLS_X509_RSASSA_PSS_SUPPORT=y
CONFIG_PSA_WANT_ALG_RSA_OAEP=y
# Certificate validity dates are checked (part 7). Mbed TLS reads time()
# = SYS_CLOCK_REALTIME, which timesync sets from SNTP; the network thread
# only reports the link as up after the first successful sync.
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
# <<< mqtt-tls

# --- Time sync (SNTP, part 7) -------------------------------------------------
CONFIG_SNTP=y

# --- Sparkplug B (part 7): nanopb protobuf runtime ----------------------------
# Generated code: app/src/proto (from app/proto/sparkplug_b.proto)
CONFIG_NANOPB=y
# Reboot command (NCMD "Node Control/Reboot")
CONFIG_REBOOT=y

# --- Software bill of materials (part 8, CRA Annex I part II) -----------------
# zephyr.meta (module/git revisions) is required by "west spdx"
# (scripts\build.ps1 -Sbom)
CONFIG_BUILD_OUTPUT_META=y

# --- Low power (part 9, docs/09-strom-data.md) --------------------------------
# Light sleep of the HP core in the idle thread (power state "standby", woken
# by the RTC timer enabled in app.overlay). power.c forbids it while the
# modem UART or a measurement is active.
CONFIG_PM=y
CONFIG_COUNTER=y
# Deep sleep (sys_poweroff) for NCMD "Node Control/Sleep"
CONFIG_POWEROFF=y
# LP core: app/remote is loaded at boot and runs every second on the LP timer
CONFIG_ESP32_ULP_COPROC_ENABLED=y
CONFIG_ESP32_ULP_LP_CORE_WAKEUP_SOURCE_LP_TIMER=y
CONFIG_ESP32_ULP_LP_CORE_LP_TIMER_SLEEP_DURATION_US=1000000
# LP image integrity check: hash of the LP partition (flash map + PSA SHA-256)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# --- Task watchdog (part 10, health.c) -----------------------------------------
# Zephyr task watchdog, hardware fallback = TIMG0 watchdog (alias watchdog0).
# The task watchdog feeds the hardware every 10 s; if that stops for 15 s
# (interrupts off, kernel stuck), the hardware watchdog resets the chip.
# 10 s keeps the extra light-sleep wake-ups at the measurement rate.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000

# --- Application (app/Kconfig) ---------------------------------------------
CONFIG_APP_SAMPLE_INTERVAL_MS=10000
CONFIG_APP_BATCH_SIZE=6
CONFIG_APP_SOURCE_DIE_TEMP=y
