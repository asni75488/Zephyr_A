# Zephyr_A - Kconfig for the HP-core application
# Part 4: data acquisition + cellular network (SIM7080G, CMUX, PPP). Later parts add MQTT, TLS, ...

# --- C standard -----------------------------------------------------------
# Project requirement: compatible with at least C17 (also the 4.4.0 default,
# set explicitly so the requirement is visible in the configuration).
CONFIG_STD_C17=y

# --- Logging --------------------------------------------------------------
CONFIG_LOG=y
# Deferred mode: log calls only queue the message, a low-priority thread
# prints it. Keeps timing-critical threads (modem, MQTT) fast.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Log level of all Zephyr_A modules (app/Kconfig, LOG_MODULE_REGISTER(..., CONFIG_APP_LOG_LEVEL))
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_LOG_BACKEND_UART=y
# Prefix log lines with a timestamp formatted as hh:mm:ss.ms
CONFIG_LOG_TIMESTAMP_64BIT=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
# Colour codes look bad in some Windows terminals; keep the output plain.
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# Print "*** Booting Zephyr OS build ... ***" banner at startup
CONFIG_BOOT_BANNER=y

# --- Hardware info (device id derived from the factory MAC in eFuse) -------
CONFIG_HWINFO=y

# --- Robustness -----------------------------------------------------------
CONFIG_ASSERT=n
CONFIG_STACK_SENTINEL=y

# --- Kernel ----------------------------------------------------------------
# k_poll(): app_logic waits on the measurement queue and the command queue
CONFIG_POLL=y

# --- Data acquisition ------------------------------------------------------
# Sensor API for the internal temperature sensor (devicetree: &coretemp)
CONFIG_SENSOR=y

# --- Cellular modem (Zephyr modem_cellular, compatible simcom,sim7080) -------
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
# Onomondo SIM: the APN is always "onomondo", no user/password, no PIN
CONFIG_MODEM_CELLULAR_APN="onomondo"
# Modem UART (uart1) is interrupt-driven (modem backend uart_isr)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Resume/suspend of the modem through the PM device API
CONFIG_PM_DEVICE=y
# Own workqueue for CMUX/PPP/chat so other system work cannot delay it
CONFIG_MODEM_DEDICATED_WORKQUEUE=y
CONFIG_MODEM_MODULES_LOG_LEVEL_WRN=y

# --- Networking: IPv4 over PPP ---------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# DNS servers are learned from the operator via PPP (IPCP)
CONFIG_DNS_RESOLVER=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y
# PPP announces a primary and a secondary DNS server
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
# Cellular round-trip times are long (and the first query wakes the radio)
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000
# zsock_getaddrinfo() allocates its result with k_calloc() -> kernel heap
# (default 0 in this configuration, which would make every lookup fail)
CONFIG_HEAP_MEM_POOL_SIZE=4096
# L4 connected/disconnected events from the connection manager
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
# TCP connect timeout for the connectivity check [ms] (cellular RTT is high)
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=10000
CONFIG_NET_LOG=y
CONFIG_NET_IF_LOG_LEVEL_WRN=y

# --- Application (app/Kconfig) ---------------------------------------------
CONFIG_APP_SAMPLE_INTERVAL_MS=10000
CONFIG_APP_BATCH_SIZE=6
CONFIG_APP_SOURCE_DIE_TEMP=y
